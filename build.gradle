plugins {
    id 'com.android.application' version '9.4.1'
    id 'com.android.library' version '9.4.1' apply false
}

android {
    namespace = 'de.j4velin.pedometer'
    compileSdk = 37

    defaultConfig {
        applicationId = 'de.j4velin.pedometer'
        minSdk = 23
        targetSdk = 37
        versionCode = 1511
        versionName = '1.5.11'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release
    }

    flavorDimensions = ['main']

    productFlavors {
        play {
            dimension = 'main'
            minSdk = 24 // required by Play Games v2
        }
        fdroid {
            dimension = 'main'
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        debug {
            debuggable = true
            signingConfig = signingConfigs.release
            minifyEnabled = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'com.github.j4velin:colorpicker:1.27.1'
    implementation project(':eazegraph')
    implementation 'com.google.android.apps.dashclock:dashclock-api:2.0.0'
    playImplementation 'com.google.android.gms:play-services-games-v2:22.1.0'
}

def props = new Properties()

def keyFile = project.file('key.properties')
if (keyFile.exists()) {
    keyFile.withInputStream { props.load(it) }
}
if (!props.keyStore || !project.file(props.keyStore).exists()) {
    logger.warn('key.properties or its keystore not found - using sample keystore!!')
    props.clear()
    project.file('key.properties.sample').withInputStream { props.load(it) }
}

android.signingConfigs.release.storeFile = project.file(props.keyStore)
android.signingConfigs.release.storePassword = props.keyStorePassword
android.signingConfigs.release.keyAlias = props.keyAlias
android.signingConfigs.release.keyPassword = props.keyAliasPassword
