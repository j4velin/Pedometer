[versions]
agp             = "9.4.1"
compileSdk      = "37"
# play needs 24 for Play Games v2; fdroid still runs on 23. Both move to 26 in a later phase.
minSdk          = "23"
minSdkPlay      = "24"
targetSdk       = "37"

activity        = "1.13.0"
core            = "1.19.1"
coroutines      = "1.11.0"
fragment        = "1.9.1"
lifecycle       = "2.11.0"
colorpicker     = "1.27.1"
dashclock       = "2.0.0"
playGames       = "22.1.0"

junit           = "4.13.2"
testCore        = "1.7.0"
testExtJunit    = "1.3.0"
# 4.17 knows SDKs up to 36, not compileSdk 37: tests pin sdk=36 in src/test/resources/robolectric.properties
robolectric     = "4.17"

# The BOM pins every androidx.compose artifact, so none of them carry a version here.
composeBom      = "2026.09.00"
# The compose compiler plugin has to match the Kotlin compiler AGP 9.4 bundles - 2.2.10, not the
# newest release. A newer one compiles, then assembleRelease fails to resolve
# org.jetbrains.kotlin:compose-group-mapping, which does not exist before 2.3.0.
kotlin          = "2.2.10"

[libraries]
activity        = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
core            = { module = "androidx.core:core-ktx", version.ref = "core" }
coroutines      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
fragment        = { module = "androidx.fragment:fragment", version.ref = "fragment" }
lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycleViewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
colorpicker     = { module = "com.github.j4velin:colorpicker", version.ref = "colorpicker" }
dashclock       = { module = "com.google.android.apps.dashclock:dashclock-api", version.ref = "dashclock" }
playGames       = { module = "com.google.android.gms:play-services-games-v2", version.ref = "playGames" }

junit           = { module = "junit:junit", version.ref = "junit" }
test-core       = { module = "androidx.test:core-ktx", version.ref = "testCore" }
test-ext-junit  = { module = "androidx.test.ext:junit-ktx", version.ref = "testExtJunit" }
robolectric     = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

compose-bom     = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui      = { module = "androidx.compose.ui:ui" }
compose-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-lifecycleViewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
